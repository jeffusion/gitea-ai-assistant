services:
  gitea-assistant:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-jeffusion}/gitea-ai-assistant:${VERSION:-latest}

    build:
      context: .
      dockerfile: Dockerfile

    container_name: gitea-assistant
    ports:
      - "5174:5174"
    volumes:
      - assistant_data:/app/data
    env_file:
      - .env
    environment:
      LOG_LEVEL: error
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5174/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

    deploy:
      resources:
        limits:
          memory: 512M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  assistant_data:
    driver: local

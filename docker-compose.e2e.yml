# E2E 测试环境：Gitea + gitea-assistant
# 用法:
# docker compose -f docker-compose.e2e.yml up -d
# ./e2e/seed.sh
# docker compose -f docker-compose.e2e.yml down -v

services:
  gitea:
    image: gitea/gitea:1.22
    container_name: e2e-gitea
    environment:
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__server__ROOT_URL=http://gitea:3000
      - GITEA__server__HTTP_PORT=3000
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__service__DISABLE_REGISTRATION=false
      - GITEA__service__REQUIRE_SIGNIN_VIEW=false
      - GITEA__webhook__ALLOWED_HOST_LIST=*
      - GITEA__webhook__SKIP_TLS_VERIFY=true
    ports:
      - "3333:3000"
    volumes:
      - gitea-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/version"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  assistant:
    build:
      context: .
      dockerfile: e2e/Dockerfile.e2e
    container_name: e2e-assistant
    depends_on:
      gitea:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - GITEA_API_URL=http://gitea:3000/api/v1
      - GITEA_ACCESS_TOKEN=${E2E_GITEA_TOKEN:-placeholder}
      - PORT=5174
      - ENCRYPTION_KEY=5752fac0e57d00e9b7954863faef878693420e6b06bc20d710897587e802668a
      - REVIEW_ENGINE=kernel
      - REVIEW_WORKDIR=/tmp/e2e-review
      - DATABASE_PATH=/data/assistant.db
      - E2E_MOCK_LLM=1
    ports:
      - "3334:5174"
    volumes:
      - assistant-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5174/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  gitea-data:
  assistant-data:
